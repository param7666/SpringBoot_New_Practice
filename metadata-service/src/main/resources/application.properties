spring.application.name=data-dictionary-service

server.port=8088
spring.datasource.url=jdbc:postgresql://localhost:5432/tcs_practice

# PostgreSQL Username
spring.datasource.username=postgres

# PostgreSQL Password
spring.datasource.password=param@1234

# PostgreSQL Driver (optional — Spring Boot auto-detects this from the URL, but explicit is fine)
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# PostgreSQL Dialect (optional in Hibernate 6+, but harmless to keep)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Optional but useful for debugging bind parameters in logs
logging.level.org.hibernate.orm.jdbc.bind=TRACE

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

#eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
#eureka.instance.prefer-ip-address=true
eureka.client.enabled=false

django-ai-service.base-url=http://localhost:8001

vision.api.base-url=http://django-ai-service

storage.wireframe-dir=C:/Users/parme/Desktop/PortFolio/wireframes

async.core-pool-size=4
async.max-pool-size=8
async.queue-capacity=50