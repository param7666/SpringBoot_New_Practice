spring:
  application:
    name: metadata-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ai_project_generator}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
server:
  port: ${SERVER_PORT:8082}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
management:
  endpoints:
    web:
      exposure:
        include: health,info
metadata:
  storage:
    directory: ${METADATA_STORAGE:storage/metadata}
