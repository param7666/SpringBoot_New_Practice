services:
  postgres:
    image: postgres:16
    container_name: project-service-postgres
    environment:
      POSTGRES_DB: ai_project_generator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - project_pg_data:/var/lib/postgresql/data

volumes:
  project_pg_data:
