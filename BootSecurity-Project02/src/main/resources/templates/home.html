<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark px-4">
        <span class="navbar-brand">Student Portal</span>
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
        </form>
    </nav>

    <div class="container mt-5">
        <div class="card p-4 shadow-sm">
            <h3>Welcome, <span th:text="${name}">Name</span>!</h3>
            <p>Role: <span class="badge bg-info" th:text="${role}">ROLE</span></p>

            <div th:if="${role == 'ADMIN'}" class="mt-3">
                <a th:href="@{/admin}" class="btn btn-warning">Go to Admin Panel</a>
            </div>
        </div>
    </div>
</body>
</html>
