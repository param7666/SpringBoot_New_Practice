<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login — The Reading Room</title>
    <style>
        :root {
            --ink: #2b2620;
            --paper: #faf7f0;
            --accent: #6b5a3e;
            --line: #ddd4c0;
            --danger: #a13d3d;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: var(--paper);
            color: var(--ink);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            width: 360px;
            padding: 2.5rem;
            background: white;
            border: 1px solid var(--line);
        }
        h1 {
            font-size: 1.6rem;
            margin: 0 0 0.3rem;
            text-align: center;
        }
        .subtitle {
            font-family: Arial, sans-serif;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--accent);
            text-align: center;
            margin-bottom: 2rem;
        }
        label {
            display: block;
            font-family: Arial, sans-serif;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--accent);
            margin-top: 1rem;
            margin-bottom: 0.3rem;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 0.6rem 0.7rem;
            border: 1px solid var(--line);
            font-family: Arial, sans-serif;
            font-size: 0.95rem;
        }
        .btn {
            width: 100%;
            margin-top: 1.75rem;
            padding: 0.7rem;
            border: 1px solid var(--ink);
            background: var(--ink);
            color: var(--paper);
            font-family: Arial, sans-serif;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .msg {
            font-family: Arial, sans-serif;
            font-size: 0.8rem;
            padding: 0.6rem;
            margin-top: 1rem;
            text-align: center;
        }
        .error { background: #f6e4e4; color: var(--danger); }
        .success { background: #eaf1e6; color: #3d6b3d; }
        .register-link {
            text-align: center;
            margin-top: 1.5rem;
            font-family: Arial, sans-serif;
            font-size: 0.85rem;
        }
        .register-link a { color: var(--accent); }
    </style>
</head>
<body>

<div class="card">
    <h1>The Reading Room</h1>
    <div class="subtitle">Sign in to continue</div>

    <div class="msg error" th:if="${param.error}">
        Invalid username or password.
    </div>
    <div class="msg success" th:if="${param.registered}">
        Account created. Please sign in.
    </div>
    <div class="msg success" th:if="${param.logout}">
        You have been logged out.
    </div>

    <form th:action="@{/login}" method="post">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autofocus />

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required />

        <button type="submit" class="btn">Sign In</button>
    </form>

    <div class="register-link">
        New here? <a th:href="@{/register}">Create an account</a>
    </div>
</div>

</body>
</html>
