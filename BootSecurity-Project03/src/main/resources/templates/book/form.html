<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${book.id} != null ? 'Edit Book' : 'Add Book'">Book Form</title>
    <style>
        :root {
            --ink: #2b2620;
            --paper: #faf7f0;
            --accent: #6b5a3e;
            --line: #ddd4c0;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: var(--paper);
            color: var(--ink);
            margin: 0;
            padding: 2rem 3rem;
        }
        .card {
            max-width: 480px;
            margin: 2rem auto;
            padding: 2rem;
            background: white;
            border: 1px solid var(--line);
        }
        h1 {
            font-size: 1.5rem;
            margin-top: 0;
            border-bottom: 2px solid var(--ink);
            padding-bottom: 0.75rem;
        }
        label {
            display: block;
            font-family: Arial, sans-serif;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--accent);
            margin-top: 1rem;
            margin-bottom: 0.3rem;
        }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 0.6rem 0.7rem;
            border: 1px solid var(--line);
            font-family: Arial, sans-serif;
            font-size: 0.95rem;
        }
        .row {
            display: flex;
            gap: 1rem;
        }
        .row > div { flex: 1; }
        .btn-group {
            margin-top: 1.75rem;
            display: flex;
            gap: 0.75rem;
        }
        .btn {
            padding: 0.6rem 1.2rem;
            border: 1px solid var(--ink);
            background: var(--ink);
            color: var(--paper);
            text-decoration: none;
            font-family: Arial, sans-serif;
            font-size: 0.85rem;
            cursor: pointer;
        }
        .btn-outline {
            background: transparent;
            color: var(--ink);
        }
    </style>
</head>
<body>

<div class="card">
    <h1 th:text="${book.id} != null ? 'Edit Book' : 'Add New Book'">Book Form</h1>

    <form th:action="${book.id} != null ? @{/book/update/{id}(id=${book.id})} : @{/book}"
      th:object="${book}" method="post">

        <label for="title">Title</label>
        <input type="text" id="title" th:field="*{title}" required />

        <label for="author">Author</label>
        <input type="text" id="author" th:field="*{author}" required />

        <label for="isbn">ISBN</label>
        <input type="text" id="isbn" th:field="*{isbn}" required />

        <label for="category">Category</label>
        <input type="text" id="category" th:field="*{category}" />

        <div class="row">
            <div>
                <label for="totalCopies">Total Copies</label>
                <input type="number" id="totalCopies" th:field="*{totalCopies}" min="0" required />
            </div>
            <div>
                <label for="availableCopies">Available Copies</label>
                <input type="number" id="availableCopies" th:field="*{availableCopies}" min="0" required />
            </div>
        </div>

        <div class="btn-group">
            <button type="submit" class="btn">Save</button>
            <a th:href="@{/book}" class="btn btn-outline">Cancel</a>
        </div>
    </form>
</div>

</body>
</html>
