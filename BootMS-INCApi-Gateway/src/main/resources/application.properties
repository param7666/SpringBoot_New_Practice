spring.application.name=api-gateway
server.port=8085


spring.main.web-application-type=reactive
# =========================
# USER SERVICE
# =========================

spring.cloud.gateway.server.webflux.routes[0].id=auth-route
spring.cloud.gateway.server.webflux.routes[0].uri=lb://user-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=user-route
spring.cloud.gateway.server.webflux.routes[1].uri=lb://user-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/user/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=AuthenticationFilter

spring.cloud.gateway.server.webflux.routes[2].id=admin-route
spring.cloud.gateway.server.webflux.routes[2].uri=lb://user-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/admin/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=AuthenticationFilter


