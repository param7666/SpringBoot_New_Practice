spring.application.name=api-gateway


server.port=8089
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true


# =========================
# USER SERVICE ROUTE
# =========================

spring.cloud.gateway.server.webflux.routes[0].id=user-service-route
spring.cloud.gateway.server.webflux.routes[0].uri=lb://user-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/users/**


# =========================
# PRODUCT SERVICE ROUTE
# =========================

spring.cloud.gateway.server.webflux.routes[1].id=product-service-route
spring.cloud.gateway.server.webflux.routes[1].uri=lb://product-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/products/**


# =========================
# ORDER SERVICE ROUTE
# =========================

spring.cloud.gateway.server.webflux.routes[2].id=order-service-route
spring.cloud.gateway.server.webflux.routes[2].uri=lb://order-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/orders/**


# =========================
# AUTH SERVICE ROUTE
# =========================
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9000

spring.cloud.gateway.server.webflux.routes[3].id=auth-service-route
spring.cloud.gateway.server.webflux.routes[3].uri=lb://auth-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/auth/**